name: Compilar firmware

on:
  push:
    paths:
      - 'CardputerTrader/**'
      - '.github/workflows/build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: CardputerTrader

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache do PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            ~/.cache/pip
          key: pio-${{ runner.os }}-${{ hashFiles('CardputerTrader/platformio.ini') }}

      - name: Instalar PlatformIO
        run: pip install --upgrade platformio

      - name: Compilar
        run: pio run -e cardputer-adv

      - name: Renomear binario
        run: cp .pio/build/cardputer-adv/firmware.bin CardputerTrader.bin

      - uses: actions/upload-artifact@v4
        with:
          name: CardputerTrader-firmware
          path: CardputerTrader/CardputerTrader.bin
